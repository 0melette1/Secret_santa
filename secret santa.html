<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<style>
  :root {
    --bg: #14281f; --card: #fffaf2; --ink: #2b2420; --muted: #7a6d63;
    --red: #c0392b; --red-dark: #962d22; --green: #1e6b45; --line: #e8dccb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image: radial-gradient(circle at 20% 10%, #1f3d2f 0, transparent 40%),
                      radial-gradient(circle at 80% 90%, #2a1a1a 0, transparent 40%);
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; color: #fff; margin-bottom: 24px; }
  .hero-gif { display: block; width: 120px; height: 120px; margin: 0 auto; border-radius: 16px; }
  h1 { margin: 8px 0 4px; font-size: 32px; letter-spacing: .5px; }
  .sub { color: #cfe3d6; margin: 0; }
  .stats { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,.1); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card p.hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  label small { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  button {
    width: 100%; margin-top: 16px; padding: 12px; font: inherit; font-weight: 700; color: #fff;
    background: var(--red); border: 0; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: var(--red-dark); }
  button:disabled { background: #b9aea4; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 14px; min-height: 1em; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  .result { text-align: center; padding: 16px 8px 4px; }
  .result .name { font-size: 30px; font-weight: 800; color: var(--red); margin: 4px 0; }
  .result .wish { background: #fff; border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-top: 12px; color: var(--ink); text-align: left; white-space: pre-wrap; }
  .result img { display: block; width: 160px; height: 160px; margin: 16px auto 0; border-radius: 12px; }
  .gallery-title { text-align: center; color: #fff; font-size: 20px; margin: 32px 0 16px; }
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .polaroid { margin: 0; padding: 8px; background: #fff; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.35); transition: transform .2s; }
  .polaroid:nth-child(odd) { transform: rotate(-2deg); }
  .polaroid:nth-child(even) { transform: rotate(2deg); }
  .polaroid:hover { transform: rotate(0) scale(1.04); position: relative; z-index: 1; }
  .polaroid:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 6px); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--line); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <img class="hero-gif" src="fotky/twerk.gif" alt="Tancujúca postavička z Among Us">
    <h1>Secret Santa</h1>
    <p class="sub" id="sub">Prihlás sa a 10. 11. sa dozvieš, komu kupuješ darček.</p>
    <div class="stats">
      <span class="pill" id="count">👥 načítavam…</span>
      <span class="pill" id="countdown">⏳</span>
      <span class="pill hidden" id="budget"></span>
    </div>
  </header>

  <section class="card" id="registerCard">
    <h2>Prihlásiť sa</h2>
    <p class="hint">Zapamätaj si PIN, budeš ho potrebovať, aby si videl, koho máš.</p>
    <form id="registerForm">
      <label for="rName">Meno</label>
      <input id="rName" maxlength="40" required autocomplete="name">
      <label for="rPin">PIN <small>(aspoň 4 znaky)</small></label>
      <input id="rPin" type="password" minlength="4" required autocomplete="new-password">
      <label for="rWish">Prianie <small>(nepovinné, uvidí ho tvoj Santa)</small></label>
      <textarea id="rWish" maxlength="300" placeholder="napr. ponožky, knihy, nič sladké…"></textarea>
      <button type="submit">Prihlásiť sa 🎁</button>
      <div class="msg" id="rMsg"></div>
    </form>
  </section>

  <section class="card" id="revealCard">
    <h2>Komu kupujem?</h2>
    <p class="hint" id="revealHint">Odomkne sa 10. 11.</p>
    <form id="revealForm">
      <label for="vName">Meno</label>
      <input id="vName" maxlength="40" required>
      <label for="vPin">PIN</label>
      <input id="vPin" type="password" required autocomplete="current-password">
      <button type="submit" id="revealBtn">Ukáž mi to 🤫</button>
      <div class="msg" id="vMsg"></div>
    </form>
    <div class="result hidden" id="result">
      <div>Kupuješ darček pre</div>
      <div class="name" id="resName"></div>
      <div class="wish hidden" id="resWish"></div>
      <img src="fotky/twerk.gif" alt="Tancujúca postavička z Among Us" loading="lazy">
    </div>
  </section>

  <h2 class="gallery-title">🎄 Santova galéria</h2>
  <section class="gallery">
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_7f83hv7f83hv7f83.jpg" alt="Santa s maskou na tvári v kuchyni" style="object-position: 50% 20%" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_e36agme36agme36a.jpg" alt="Santa pozerá podozrievavo do foťáku" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_g4s2reg4s2reg4s2.jpg" alt="Santa so zdeseným výrazom" style="object-position: 50% 30%" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_qi47qpqi47qpqi47.jpg" alt="Santa so širokým úsmevom" style="object-position: 50% 30%" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_tfmmd7tfmmd7tfmm.jpg" alt="Santa so psom v santovskej čiapke" style="object-position: 45% 50%" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_2yyckh2yyckh2yyc.jpg" alt="Santa oddychuje na gauči" style="object-position: 20% 45%" loading="lazy">
    </figure>
    <figure class="polaroid">
      <img src="fotky/Gemini_Generated_Image_12awe012awe012aw.jpg" alt="Santa v okuliaroch zblízka" style="object-position: 50% 30%" loading="lazy">
    </figure>
  </section>
</main>

<script>
  // ===== NASTAVENIA =====
  // Sem vlož URL z Apps Scriptu (Nasadiť → Webová aplikácia), končí na /exec.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbRg0J0BipKFmRNZv_yQsHUZ3UxaGnBEjgkF-RBQ0bD5DcEqg_-tnrn22o1iqjuQ/exec';
  // Limit na darček, nechaj prázdne '' ak ho nechceš zobraziť.
  const BUDGET = 'do 500 czk';
  // Záložný termín, keby sa nepodarilo načítať zo servera (musí sedieť s Code.gs).
  let deadline = new Date('2026-11-10T00:00:00+01:00');

  const $ = id => document.getElementById(id);

  async function api(action, data = {}) {
    if (SCRIPT_URL.startsWith('SEM_')) throw new Error('Stránka ešte nie je prepojená s Apps Scriptom (SCRIPT_URL).');
    // Bez hlavičky Content-Type ide o „simple request“, takže Apps Script nezablokuje CORS.
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
    return res.json();
  }

  function setMsg(el, text, ok) {
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function isOpen() { return Date.now() >= deadline.getTime(); }

  function updateUi() {
    const fmt = deadline.toLocaleString('sk-SK', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
    if (isOpen()) {
      $('countdown').textContent = '🎉 Losovanie je odomknuté';
      $('sub').textContent = 'Zadaj meno a PIN a uvidíš, komu kupuješ darček.';
      $('registerCard').classList.add('hidden');
      $('revealHint').textContent = 'Nikomu to neprezraď 😉';
      $('revealBtn').disabled = false;
    } else {
      const ms = deadline - Date.now();
      const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
      $('countdown').textContent = `⏳ ${d} d ${h} h ${m} min`;
      $('revealHint').textContent = `Odomkne sa ${fmt}.`;
      $('revealBtn').disabled = true;
    }
  }

  async function loadInfo() {
    try {
      const r = await api('info');
      if (r.ok) {
        deadline = new Date(r.deadline);
        $('count').textContent = `👥 prihlásených: ${r.count}`;
      }
    } catch (e) {
      $('count').textContent = '👥 ?';
      setMsg($('rMsg'), e.message, false);
    }
    updateUi();
  }

  $('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    setMsg($('rMsg'), 'Ukladám…', true);
    try {
      const r = await api('register', { name: $('rName').value, pin: $('rPin').value, wish: $('rWish').value });
      if (r.ok) {
        setMsg($('rMsg'), `Hotovo, ${$('rName').value.trim()}! Si prihlásený. Vráť sa sem po termíne. 🎄`, true);
        $('count').textContent = `👥 prihlásených: ${r.count}`;
        e.target.reset();
      } else setMsg($('rMsg'), r.error, false);
    } catch (err) { setMsg($('rMsg'), err.message || 'Nepodarilo sa spojiť so serverom.', false); }
    btn.disabled = false;
  });

  $('revealForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('revealBtn'); btn.disabled = true;
    setMsg($('vMsg'), 'Pozerám do Santovho zoznamu…', true);
    try {
      const r = await api('reveal', { name: $('vName').value, pin: $('vPin').value });
      if (r.ok) {
        $('revealForm').classList.add('hidden');
        $('resName').textContent = r.recipient;
        if (r.wish) { $('resWish').textContent = '💌 Prianie: ' + r.wish; $('resWish').classList.remove('hidden'); }
        $('result').classList.remove('hidden');
      } else setMsg($('vMsg'), r.error, false);
    } catch (err) { setMsg($('vMsg'), err.message || 'Nepodarilo sa spojiť so serverom.', false); }
    btn.disabled = !isOpen();
  });

  if (BUDGET) { $('budget').textContent = '💶 ' + BUDGET; $('budget').classList.remove('hidden'); }
  updateUi();
  loadInfo();
  setInterval(updateUi, 30000);
</script>
</body>
</html>
